<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 205" width="100%" height="100%">
  <defs>
    <linearGradient id="bgIn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="420" height="205" rx="18" fill="url(#bgIn)" stroke="#334155" stroke-width="1.5"/>
  <text x="20" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Interactive Tag Input &amp; Autocomplete</text>

  <!-- Input Container -->
  <rect x="20" y="38" width="380" height="92" rx="14" fill="#0B1120" stroke="#6366F1" stroke-width="1.6">
    <animate attributeName="stroke" values="#6366F1;#38BDF8;#6366F1" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Row 1 Tags -->
  <g transform="translate(32, 50)">
    <rect x="0" y="0" width="88" height="28" rx="14" fill="#38BDF8" fill-opacity="0.18" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="36" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#E0F2FE" text-anchor="middle">#flutter</text>
    <circle cx="74" cy="14" r="7" fill="#38BDF8" fill-opacity="0.25"/>
    <text x="74" y="17.5" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#E0F2FE" text-anchor="middle">×</text>

    <rect x="96" y="0" width="74" height="28" rx="14" fill="#6366F1" fill-opacity="0.22" stroke="#818CF8" stroke-width="1.2"/>
    <text x="125" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#E0E7FF" text-anchor="middle">#dart</text>
    <circle cx="156" cy="14" r="7" fill="#818CF8" fill-opacity="0.25"/>
    <text x="156" y="17.5" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#E0E7FF" text-anchor="middle">×</text>

    <rect x="178" y="0" width="152" height="28" rx="14" fill="#A855F7" fill-opacity="0.22" stroke="#C084FC" stroke-width="1.2"/>
    <text x="228" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#F3E8FF" text-anchor="middle">#humanize-ai</text>
    <rect x="274" y="6" width="32" height="16" rx="8" fill="#A855F7"/>
    <text x="290" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle">PRO</text>
    <circle cx="317" cy="14" r="7" fill="#C084FC" fill-opacity="0.25"/>
    <text x="317" y="17.5" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#F3E8FF" text-anchor="middle">×</text>
  </g>

  <!-- Row 2: Animated Typing -> Pill Conversion -->
  <g transform="translate(32, 88)">
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.48;0.88;0.95" dur="5s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="102" height="28" rx="14" fill="#10B981" fill-opacity="0.22" stroke="#34D399" stroke-width="1.3"/>
      <text x="42" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#D1FAE5" text-anchor="middle">#material3</text>
      <circle cx="88" cy="14" r="7" fill="#34D399" fill-opacity="0.25"/>
      <text x="88" y="17.5" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#D1FAE5" text-anchor="middle">×</text>
    </g>
    <g>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.40;0.46;0.92;1" dur="5s" repeatCount="indefinite"/>
      <text x="4" y="19" font-family="monospace" font-size="12.5" font-weight="600" fill="#94A3B8">#material3,</text>
      <rect x="88" y="6" width="2" height="16" fill="#38BDF8">
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect x="308" y="3" width="48" height="22" rx="11" fill="#6366F1" fill-opacity="0.2"/>
    <text x="332" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#818CF8" text-anchor="middle">4 / 8</text>
  </g>

  <!-- Live Suggestions -->
  <g transform="translate(20, 144)">
    <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#64748B">Suggestions:</text>
    <rect x="74" y="0" width="76" height="24" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="112" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#CBD5E1" text-anchor="middle">+ #pubdev</text>

    <rect x="158" y="0" width="84" height="24" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1">
      <animate attributeName="fill" values="#1E293B;#0284C7;#1E293B" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="200" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#E0F2FE" text-anchor="middle">+ #material3</text>

    <rect x="250" y="0" width="96" height="24" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="298" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#CBD5E1" text-anchor="middle">+ #opensource</text>
  </g>
</svg>
