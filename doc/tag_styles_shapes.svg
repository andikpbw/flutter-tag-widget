<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 205" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ptGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="rbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="glGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <rect width="420" height="205" rx="18" fill="url(#bgSh)" stroke="#334155" stroke-width="1.5"/>
  <text x="20" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Custom Tag Silhouettes &amp; 6 Theme Presets</text>

  <!-- Row 1: PriceTag & Ticket -->
  <g transform="translate(20, 44)">
    <path d="M 0,18 L 16,0 L 182,0 A 8,8 0 0,1 190,8 L 190,28 A 8,8 0 0,1 182,36 L 16,36 Z"
          fill="url(#ptGrad)" stroke="#FDA4AF" stroke-width="1.3"/>
    <circle cx="17" cy="18" r="3.8" fill="#0F172A" stroke="#FDA4AF" stroke-width="1.2"/>
    <text x="80" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">Flash Sale • $29</text>
    <rect x="140" y="8" width="38" height="20" rx="10" fill="#000000" fill-opacity="0.28"/>
    <text x="159" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#FEF08A" text-anchor="middle">-40%</text>

    <g transform="translate(202, 0)">
      <path d="M 8,0 L 170,0 A 8,8 0 0,1 178,8 L 178,12 A 6,6 0 0,0 178,24 L 178,28 A 8,8 0 0,1 170,36 L 8,36 A 8,8 0 0,1 0,28 L 0,24 A 6,6 0 0,0 0,12 L 0,8 A 8,8 0 0,1 8,0 Z"
            fill="#090D16" stroke="#00F5D4" stroke-width="1.6">
        <animate attributeName="stroke-opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
      </path>
      <text x="89" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#00F5D4" text-anchor="middle">★ VIP Pass 2026</text>
    </g>
  </g>

  <!-- Row 2: Ribbon & Glass Pill -->
  <g transform="translate(20, 96)">
    <path d="M 8,0 L 174,0 L 162,18 L 174,36 L 8,36 A 8,8 0 0,1 0,28 L 0,8 A 8,8 0 0,1 8,0 Z"
          fill="url(#rbGrad)" stroke="#F5D0FE" stroke-width="1.2"/>
    <text x="80" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">✦ Featured Story</text>

    <g transform="translate(188, 0)">
      <rect x="0" y="0" width="192" height="36" rx="18" fill="url(#glGrad)" stroke="#818CF8" stroke-width="1.4"/>
      <circle cx="20" cy="18" r="11" fill="#6366F1"/>
      <text x="20" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">AI</text>
      <text x="88" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">Glassmorphic</text>
      <rect x="146" y="8" width="34" height="20" rx="10" fill="#6366F1" fill-opacity="0.45"/>
      <text x="163" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">99+</text>
    </g>
  </g>

  <!-- Row 3: Outlined, Modern & Soft -->
  <g transform="translate(20, 148)">
    <rect x="0" y="0" width="114" height="34" rx="17" fill="none" stroke="#4ADE80" stroke-width="1.5"/>
    <text x="57" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#4ADE80" text-anchor="middle">✓ Outlined</text>

    <rect x="126" y="0" width="124" height="34" rx="10" fill="#6366F1" stroke="#818CF8" stroke-width="1.2"/>
    <text x="188" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓ Modern M3</text>

    <rect x="260" y="0" width="120" height="34" rx="10" fill="#E2E8F0" stroke="#FFFFFF" stroke-width="1.2"/>
    <text x="320" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1E293B" text-anchor="middle">Soft Tactile 12</text>
  </g>
</svg>
