<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 205" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="420" height="205" rx="18" fill="url(#bgGr)" stroke="#334155" stroke-width="1.5"/>
  <text x="20" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Filter Tag Group &amp; Collapsible Overflow</text>

  <!-- Row 1 -->
  <g transform="translate(20, 46)">
    <rect x="0" y="0" width="76" height="34" rx="17" fill="#6366F1" fill-opacity="0.16" stroke="#6366F1" stroke-width="1.3"/>
    <text x="26" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0" text-anchor="middle">All</text>
    <rect x="44" y="7" width="24" height="20" rx="10" fill="#6366F1" fill-opacity="0.35"/>
    <text x="56" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#C7D2FE" text-anchor="middle">7</text>

    <rect x="86" y="0" width="136" height="34" rx="17" fill="#6366F1" stroke="#818CF8" stroke-width="1.4"/>
    <text x="138" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓ Mobile UI</text>
    <rect x="188" y="7" width="26" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.22"/>
    <text x="201" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">42</text>

    <rect x="232" y="0" width="144" height="34" rx="17" fill="#8B5CF6" stroke="#C084FC" stroke-width="1.4">
      <animate attributeName="fill-opacity" values="1;1;0.18;0.18;1" keyTimes="0;0.45;0.52;0.88;0.95" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="284" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓ AI &amp; LLM</text>
    <rect x="336" y="7" width="32" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.22"/>
    <text x="352" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">128</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(20, 92)">
    <rect x="0" y="0" width="146" height="34" rx="17" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
    <text x="56" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#CBD5E1" text-anchor="middle">Design System</text>
    <rect x="112" y="7" width="26" height="20" rx="10" fill="#334155"/>
    <text x="125" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#94A3B8" text-anchor="middle">35</text>

    <rect x="156" y="0" width="134" height="34" rx="17" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
    <text x="208" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#CBD5E1" text-anchor="middle">Open Source</text>
    <rect x="256" y="7" width="26" height="20" rx="10" fill="#334155"/>
    <text x="269" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#94A3B8" text-anchor="middle">89</text>

    <rect x="300" y="0" width="80" height="34" rx="17" fill="#6366F1" fill-opacity="0.2" stroke="#818CF8" stroke-dasharray="3,2" stroke-width="1.4">
      <animate attributeName="fill-opacity" values="0.18;0.45;0.18" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="340" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#A5B4FC" text-anchor="middle">+3 more</text>
  </g>

  <!-- Row 3: Animated Expanded Overflow -->
  <g transform="translate(20, 140)">
    <animate attributeName="opacity" values="0.3;1;1;0.3" keyTimes="0;0.3;0.8;1" dur="5s" repeatCount="indefinite"/>
    <rect x="0" y="0" width="128" height="32" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="64" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#BAE6FD" text-anchor="middle">WebAssembly 19</text>

    <rect x="136" y="0" width="118" height="32" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="1.2"/>
    <text x="195" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#BAE6FD" text-anchor="middle">Animations 64</text>

    <rect x="262" y="0" width="96" height="32" rx="16" fill="#334155" stroke="#94A3B8" stroke-width="1"/>
    <text x="310" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">▴ Show less</text>
  </g>
</svg>
