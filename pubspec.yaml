version: 1.0.0
homepage: https://humanize.id
repository: https://github.com/andikpbw/flutter-tag-widget
issue_tracker: https://github.com/andikpbw/flutter-tag-widget/issues
documentation: https://github.com/andikpbw/flutter-tag-widget#readme

funding:
